# Settings for testing on your computer: `go run . -dev :4174`
# Emails are printed in the terminal, never sent.
#
# The real settings live on the server in /var/www/contact/contact.conf
# (see README.md). That file is never committed.

FROM = Jackson Mercuri <hello@example.com>
REPLY_TO =
NOTIFY_TO = me@example.com
LAST_NAME = Mercuri
DATA_DIR = dev-data
DRY_RUN = 1
