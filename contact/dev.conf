# Settings for testing on your computer: `go run . -dev :4174`
# Emails are printed in the terminal, never sent.
#
# On the server, copy this to /var/www/contact/contact.conf, set real
# addresses and the SMTP2GO key, and remove DRY_RUN. That file must never be
# committed (contact.conf is in .gitignore).

FROM = Jackson Mercuri <hello@example.com>
REPLY_TO =
NOTIFY_TO = me@example.com
LAST_NAME = Mercuri
DATA_DIR = dev-data
DRY_RUN = 1
